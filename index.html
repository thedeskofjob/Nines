<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NINES — Daily supplements for life after the snip</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="page">
  <section class="panel-left">
    <header class="logo">
      <img src="assets/logo.svg" alt="Nines">
    </header>

    <div class="hero-copy">
      <h1 class="headline">Daily supplements<br>for life after the snip.<br>Coming Fall 2026.</h1>

      <form class="signup" id="signupForm" novalidate>
        <p class="signup-label">Paws Here for First Dibs</p>

        <div class="signup-controls">
          <div class="input-wrap">
            <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
          </div>
          <button type="submit" class="join-btn">
            <span>Join The Pack</span>
            <img src="assets/arrow.svg" alt="" class="arrow-icon">
          </button>
        </div>

        <p class="disclaimer">By signing up you agree to receive emails from NINES. Unsubscribe anytime.</p>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </div>

    <footer class="social">
      <span class="handle">@ninesfordogs</span>
      <a href="#" class="icon-link" aria-label="Instagram">
        <span class="icon-mask ig" style="--mask-url:url('assets/ig-shape.svg')"></span>
      </a>
      <a href="#" class="icon-link" aria-label="TikTok">
        <img src="assets/tiktok.svg" alt="" class="tiktok-base">
        <span class="icon-mask tt" style="--mask-url:url('assets/tiktok-vector.svg')"></span>
      </a>
    </footer>
  </section>

  <section class="panel-right">
    <img src="assets/hero.png" alt="Dog wearing sunglasses and a headscarf riding in a red convertible" class="hero-image">
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
